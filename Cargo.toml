[workspace]
members = [
    "crates/pit-artifact",
    "crates/pit-builder-core",
    "crates/pit-builder-go",
    "crates/pit-builder-native",
    "crates/pit-builder-js",
    "crates/pit-builder-python",
    "crates/pit-builder-experimental",
    "crates/pit-crew",
    "crates/pit-builder-rust",
]
exclude = ["fixtures/rust-hello", "fixtures/rust-infinite", "fixtures/rust-memory", "fixtures/rust-cpu"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
wasmparser = "0.240"
